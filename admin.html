<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK Music - Admin Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 240px;
            background-color: #1e1e1e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        .sidebar-brand {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 24px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .card-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        /* Form Sections */
        .form-section {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 25px;
        }
        .form-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            outline: none;
        }
        .btn-save {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover {
            background-color: #cc0000;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #333;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-circle-play"></i>
            <span>DK Admin</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-link active"><i class="fa-solid fa-chart-line"></i> Dashboard</li>
            <li class="nav-link"><i class="fa-solid fa-key"></i> API Settings</li>
            <li class="nav-link"><i class="fa-solid fa-sliders"></i> Banners & Chips</li>
            <li class="nav-link"><i class="fa-solid fa-rectangle-ad"></i> AdMob Ads</li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="header">
            <h1>App Management Dashboard</h1>
            <span style="font-size: 14px; color: #aaa;"><i class="fa-solid fa-signal" style="color:#00ff00;"></i> System Ready</span>
        </div>

        <!-- Fresh Start Stats Grid (Zero Values) -->
        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Total Song Plays</div>
                <div class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">Active Users Now</div>
                <div class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">Ad Impressions</div>
                <div class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">AdMob Revenue (Est.)</div>
                <div class="card-value" style="color:#00ff00;">$0.00</div>
            </div>
        </div>

        <!-- Live Chart (Starting Fresh) -->
        <div class="form-section">
            <h3><i class="fa-solid fa-chart-area"></i> App Usage Analytics</h3>
            <div id="chart_div" style="width: 100%; height: 250px;"></div>
        </div>

        <!-- YouTube API Key Setup -->
        <div class="form-section">
            <h3><i class="fa-solid fa-key"></i> YouTube API Key Control</h3>
            <div class="input-group">
                <label>Primary YouTube Data API Key</label>
                <input type="text" id="primaryApiKey" placeholder="अपनी असली API Key यहाँ डालें..." value="">
            </div>
            <div class="input-group">
                <label>Backup API Key (Optional)</label>
                <input type="text" id="backupApiKey" placeholder="बैकअप API Key यहाँ डालें..." value="">
            </div>
            <button class="btn-save" onclick="saveSettings()">Save API Keys</button>
        </div>

        <!-- AdMob Strategy Setup -->
        <div class="form-section">
            <h3><i class="fa-solid fa-rectangle-ad"></i> AdMob Integration Logic</h3>
            <div class="input-group">
                <label>Show Ad Every (Number of Songs Played)</label>
                <select id="adFrequency">
                    <option value="2">2 Songs</option>
                    <option value="3" selected>3 Songs (Recommended)</option>
                    <option value="4">4 Songs</option>
                    <option value="5">5 Songs</option>
                </select>
            </div>
            <div class="input-group">
                <label>AdMob Interstitial Ad Unit ID</label>
                <input type="text" id="interstitialAdId" placeholder="ca-app-pub-xxxxxxxx~xxxxxxxx" value="">
            </div>
            <button class="btn-save" onclick="saveSettings()">Save Ad Settings</button>
        </div>
    </div>

    <script>
        // Google Charts Load
        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
            var data = google.visualization.arrayToDataTable([
                ['Time', 'Song Plays', 'Ad Views'],
                ['Start',  0,      0]
            ]);

            var options = {
                backgroundColor: 'transparent',
                hAxis: {textStyle: {color: '#888'}},
                vAxis: {textStyle: {color: '#888'}},
                legend: {textStyle: {color: '#fff'}},
                colors: ['#ff0000', '#00ff00']
            };

            var chart = new google.visualization.AreaChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }

        function saveSettings() {
            alert('Settings successfully updated!');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK Music Clone</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #030303;
            color: #ffffff;
            padding-bottom: 80px;
            overflow-x: hidden;
            max-width: 100vw;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: #030303;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
        }
        .logo i {
            color: #ff0000;
            font-size: 24px;
        }
        
        /* Top Banner Slider */
        .banner-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .banner-container::-webkit-scrollbar {
            display: none;
        }
        .banner-card {
            min-width: 150px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid #333;
        }
        .banner-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.75);
            font-size: 10px;
            padding: 4px 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chips-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar {
            display: none;
        }
        .chip {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip.active {
            background-color: #ffffff;
            color: #000000;
        }
        .search-bar {
            display: flex;
            margin: 10px 20px;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #212121;
            color: white;
            outline: none;
            width: 100%;
        }
        .search-bar button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: #ff0000;
            color: white;
            cursor: pointer;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
            width: 100%;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            position: relative;
            width: 100%;
        }
        .list-item img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .song-info {
            flex: 1;
            overflow: hidden;
        }
        .song-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 3-Dot Menu Dropdown */
        .menu-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            padding: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 10px;
            top: 45px;
            background: #282828;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            z-index: 99;
            width: 150px;
        }
        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #383838;
        }
        .dropdown-menu a:last-child {
            border-bottom: none;
        }
        .dropdown-menu a:hover {
            background: #383838;
        }

        /* Normal Main Player */
        #player-container {
            padding: 0 20px;
            margin-top: 15px;
            width: 100%;
        }
        
        /* Floating Mini Player (छोटा फ्लोटिंग बॉक्स) */
        .mini-player-active {
            position: fixed !important;
            bottom: 60px !important;
            right: 15px !important;
            width: 180px !important;
            z-index: 9999 !important;
            background: #212121;
            padding: 5px !important;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #333;
            margin: 0 !important;
        }
        .mini-player-active iframe {
            height: 100px !important;
            border-radius: 8px;
        }
        .close-mini-btn {
            display: none;
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .mini-player-active .close-mini-btn {
            display: flex;
        }

        iframe {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            border: none;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #212121;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #aaa;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <i class="fa-solid fa-circle-play"></i>
            <span>DK Music</span>
        </div>
    </div>

    <!-- ऑटो-स्लाइड बैनर -->
    <div class="banner-container" id="bannerContainer"></div>

    <div class="chips-container">
        <div class="chip active">Podcasts</div>
        <div class="chip">Romance</div>
        <div class="chip">Feel good</div>
        <div class="chip">Relax</div>
        <div class="chip">Energise</div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs or artists..." value="New Rajasthani Songs">
        <button onclick="handleSearch()">Search</button>
    </div>

    <!-- प्लेयर कंटेनर (मिनी प्लेयर में बदलने वाला) -->
    <div id="player-container"></div>

    <div class="section-header">
        <div class="section-title">Quick picks</div>
    </div>

    <div class="list-container" id="results"></div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-compass"></i>
            <span>Samples</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-bookmark"></i>
            <span>Library</span>
        </div>
    </div>

    <script>
        // ⚠️ अपनी असली API Key यहाँ डालें
        const API_KEY = "AIzaSyBAZCyyRc8pwqiP_FFQRbDWABWkrP_5AXs";
        let isPlaying = false;

        window.onload = () => {
            searchSongs();
            startAutoScroll();
        };

        // नया गाना सर्च करने का हैंडलर
        function handleSearch() {
            // अगर गाना चल रहा है तो सर्च करते ही वह मिनी प्लेयर में चला जाएगा
            if (isPlaying) {
                minimizePlayer();
            }
            searchSongs();
        }

        async function searchSongs() {
            const query = document.getElementById('searchInput').value || 'Trending Rajasthani Songs';
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query)}&key=${API_KEY}&maxResults=10`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items) {
                    displayBanners(data.items);
                    displayResults(data.items);
                } else if (data.error) {
                    alert("Error: " + data.error.message);
                } else {
                    alert("Songs nahi mile.");
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function displayBanners(songs) {
            const bannerContainer = document.getElementById('bannerContainer');
            bannerContainer.innerHTML = '';

            songs.slice(0, 6).forEach(song => {
                const videoId = song.id.videoId;
                const title = song.snippet.title;
                const thumbnailUrl = song.snippet.thumbnails.medium.url;

                const card = document.createElement('div');
                card.className = 'banner-card';
                card.onclick = () => playSong(videoId);

                card.innerHTML = `
                    <img src="${thumbnailUrl}" alt="${title}">
                    <div class="banner-title">${title}</div>
                `;
                bannerContainer.appendChild(card);
            });
        }

        function startAutoScroll() {
            const container = document.getElementById('bannerContainer');
            setInterval(() => {
                if (container) {
                    if (container.scrollLeft + container.clientWidth >= container.scrollWidth) {
                        container.scrollTo({ left: 0, behavior: 'smooth' });
                    } else {
                        container.scrollBy({ left: 160, behavior: 'smooth' });
                    }
                }
            }, 3000);
        }

        function displayResults(songs) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            songs.forEach((song, index) => {
                const videoId = song.id.videoId;
                const title = song.snippet.title;
                const channelTitle = song.snippet.channelTitle;
                const thumbnailUrl = song.snippet.thumbnails.medium.url;
                const ytUrl = `https://www.youtube.com/watch?v=${videoId}`;

                const item = document.createElement('div');
                item.className = 'list-item';

                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px; flex:1; cursor:pointer; overflow:hidden;" onclick="playSong('${videoId}')">
                        <img src="${thumbnailUrl}" alt="${title}">
                        <div class="song-info">
                            <div class="song-title">${title}</div>
                            <div class="song-artist">${channelTitle}</div>
                        </div>
                    </div>
                    <button class="menu-btn" onclick="toggleMenu(event, ${index})"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    <div class="dropdown-menu" id="menu-${index}">
                        <a href="${ytUrl}" target="_blank"><i class="fa-solid fa-download"></i> Download / Watch</a>
                        <a href="#" onclick="shareSong('${ytUrl}', '${title}')"><i class="fa-solid fa-share"></i> Share</a>
                    </div>
                `;

                resultsContainer.appendChild(item);
            });
        }

        function toggleMenu(event, index) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
            const menu = document.getElementById(`menu-${index}`);
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        }

        function shareSong(url, title) {
            if (navigator.share) {
                navigator.share({ title: title, url: url }).catch(console.error);
            } else {
                prompt("Yeh raha song link copy karein:", url);
            }
        }

        // गाना बजाने का फ़ंक्शन (फुल साइज)
        function playSong(videoId) {
            isPlaying = true;
            const playerContainer = document.getElementById('player-container');
            
            // मिनी प्लेयर स्टाइल हटाएं अगर पहले से था
            playerContainer.classList.remove('mini-player-active');

            playerContainer.innerHTML = `
                <div id="video-wrapper" style="position:relative;">
                    <button class="close-mini-btn" onclick="closePlayer()">✕</button>
                    <iframe 
                        id="yt-video"
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        allow="autoplay; encrypted-media; fullscreen" 
                        allowfullscreen>
                    </iframe>
                </div>
            `;
            playerContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // प्लेयर को छोटे बॉक्स में भेजने का फ़ंक्शन
        function minimizePlayer() {
            const playerContainer = document.getElementById('player-container');
            if (isPlaying && playerContainer) {
                playerContainer.classList.add('mini-player-active');
            }
        }

        // प्लेयर पूरी तरह से कट (बंद) करने का फ़ंक्शन
        function closePlayer() {
            isPlaying = false;
            const playerContainer = document.getElementById('player-container');
            playerContainer.classList.remove('mini-player-active');
            playerContainer.innerHTML = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DK Music Clone</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #030303; color: #ffffff; padding-bottom: 80px; overflow-x: hidden; max-width: 100vw; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: sticky; top: 0; background: #030303; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; }
        .logo i { color: #ff0000; font-size: 24px; }
        .banner-container { display: flex; gap: 12px; overflow-x: auto; padding: 10px 20px; scrollbar-width: none; scroll-behavior: smooth; }
        .banner-container::-webkit-scrollbar { display: none; }
        .banner-card { min-width: 150px; height: 90px; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; flex-shrink: 0; border: 1px solid #333; }
        .banner-card img { width: 100%; height: 100%; object-fit: cover; }
        .banner-title { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.75); font-size: 10px; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chips-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px; scrollbar-width: none; }
        .chips-container::-webkit-scrollbar { display: none; }
        .chip { background-color: rgba(255, 255, 255, 0.1); padding: 8px 16px; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .chip.active { background-color: #ffffff; color: #000000; }
        .search-bar { display: flex; margin: 10px 20px; gap: 10px; }
        .search-bar input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background: #212121; color: white; outline: none; width: 100%; }
        .search-bar button { padding: 10px 20px; border-radius: 20px; border: none; background: #ff0000; color: white; cursor: pointer; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px; }
        .section-title { font-size: 22px; font-weight: bold; }
        .list-container { display: flex; flex-direction: column; gap: 12px; padding: 0 20px; width: 100%; }
        .list-item { display: flex; align-items: center; gap: 15px; cursor: pointer; position: relative; width: 100%; }
        .list-item img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 13px; color: #aaa; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-btn { background: none; border: none; color: #aaa; font-size: 18px; padding: 10px; cursor: pointer; flex-shrink: 0; }
        .dropdown-menu { display: none; position: absolute; right: 10px; top: 45px; background: #282828; border-radius: 8px; box-shadow: 0px 4px 12px rgba(0,0,0,0.5); z-index: 99; width: 150px; }
        .dropdown-menu a { display: block; padding: 10px 15px; color: white; text-decoration: none; font-size: 13px; border-bottom: 1px solid #383838; }
        .dropdown-menu a:last-child { border-bottom: none; }
        .dropdown-menu a:hover { background: #383838; }
        #player-container { padding: 0 20px; margin-top: 15px; width: 100%; }
        .fullscreen-active { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 999999 !important; background: #000 !important; padding: 0 !important; margin: 0 !important; }
        .fullscreen-active #video-wrapper { width: 100vw !important; height: 100vh !important; }
        .fullscreen-active iframe { width: 100vw !important; height: 100vh !important; border-radius: 0 !important; }
        .custom-fs-btn { position: absolute; bottom: 15px; right: 15px; background: rgba(0, 0, 0, 0.75); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 100005; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        .custom-fs-btn i { color: #ffffff; font-size: 16px; }
        .mini-player-active { position: fixed !important; bottom: 60px !important; right: 15px !important; width: 180px !important; z-index: 9999 !important; background: #212121; padding: 5px !important; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; margin: 0 !important; }
        .mini-player-active iframe { height: 100px !important; border-radius: 8px; }
        .mini-player-active .custom-fs-btn { display: none !important; }
        .close-mini-btn { display: none; position: absolute; top: -10px; right: -10px; background: #ff0000; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .mini-player-active .close-mini-btn { display: flex; }
        iframe { width: 100%; height: 220px; border-radius: 12px; border: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #212121; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #aaa; cursor: pointer; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: #fff; }
        .loading-more { text-align: center; padding: 15px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><i class="fa-solid fa-circle-play"></i><span>DK Music</span></div>
    </div>
    <div class="banner-container" id="bannerContainer"></div>
    <div class="chips-container" id="chipsContainer">
        <div class="chip active" onclick="filterCategory('Podcasts', this)">Podcasts</div>
        <div class="chip" onclick="filterCategory('Romance', this)">Romance</div>
        <div class="chip" onclick="filterCategory('Feel good songs', this)">Feel good</div>
        <div class="chip" onclick="filterCategory('Relaxing music', this)">Relax</div>
        <div class="chip" onclick="filterCategory('Energising songs', this)">Energise</div>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs or artists..." value="New Rajasthani Songs">
        <button onclick="handleSearch()">Search</button>
    </div>
    <div id="player-container"></div>
    <div class="section-header"><div class="section-title">Quick picks</div></div>
    <div class="list-container" id="results"></div>
    <div class="loading-more" id="loadingMore" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> और गाने लोड हो रहे हैं...</div>
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item"><i class="fa-solid fa-compass"></i><span>Samples</span></div>
        <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></div>
        <div class="nav-item"><i class="fa-solid fa-bookmark"></i><span>Library</span></div>
    </div>
    <script>
        const API_KEYS = [
            "AIzaSyDimFQoOR2a-OEQkPtGfG0aDtcP75jEIPQ"
        ];
        
        let currentKeyIndex = 0; 
        let isPlaying = false;
        let isFullScreen = false;
        let nextPageToken = "";
        let isLoadingMore = false;

        window.onload = () => {
            searchSongs(false);
            startAutoScroll();
            setupInfiniteScroll();
        };

        function handleSearch() {
            if (isPlaying) { minimizePlayer(); }
            searchSongs(false);
        }

        function filterCategory(categoryName, element) {
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = categoryName;
            if (isPlaying) { minimizePlayer(); }
            searchSongs(false);
        }

        async function searchSongs(isLoadMore = false) {
            if (isLoadMore && isLoadingMore) return;
            if (isLoadMore) {
                isLoadingMore = true;
                document.getElementById('loadingMore').style.display = 'block';
            } else {
                nextPageToken = "";
                document.getElementById('results').innerHTML = '';
            }

            const query = document.getElementById('searchInput').value || 'Trending Rajasthani Songs';
            let activeKey = API_KEYS[currentKeyIndex];
            let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query)}&key=${activeKey}&maxResults=15`;

            if (isLoadMore && nextPageToken) { url += `&pageToken=${nextPageToken}`; }

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    if (currentKeyIndex < API_KEYS.length - 1) {
                        currentKeyIndex++;
                        isLoadingMore = false;
                        searchSongs(isLoadMore);
                        return;
                    } else {
                        alert("सभी API Keys की लिमिट समाप्त हो चुकी है। कृपया दोपहर 12:30 बजे के बाद प्रयास करें।");
                    }
                } else if (data.items) {
                    nextPageToken = data.nextPageToken || "";
                    if (!isLoadMore) { displayBanners(data.items); }
                    displayResults(data.items);
                }
            } catch (error) {
                console.error("Error:", error);
            } finally {
                isLoadingMore = false;
                document.getElementById('loadingMore').style.display = 'none';
            }
        }

        function setupInfiniteScroll() {
            window.onscroll = () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
                    if (nextPageToken && !isLoadingMore) { searchSongs(true); }
                }
            };
        }

        function displayBanners(songs) {
            const bannerContainer = document.getElementById('bannerContainer');
            bannerContainer.innerHTML = '';
            songs.slice(0, 6).forEach(song => {
                const videoId = song.id.videoId;
                const title = song.snippet.title;
                const thumbnailUrl = song.snippet.thumbnails.medium.url;
                const card = document.createElement('div');
                card.className = 'banner-card';
                card.onclick = () => playSong(videoId);
                card.innerHTML = `<img src="${thumbnailUrl}" alt="${title}"><div class="banner-title">${title}</div>`;
                bannerContainer.appendChild(card);
            });
        }

        function startAutoScroll() {
            const container = document.getElementById('bannerContainer');
            setInterval(() => {
                if (container) {
                    if (container.scrollLeft + container.clientWidth >= container.scrollWidth) {
                        container.scrollTo({ left: 0, behavior: 'smooth' });
                    } else {
                        container.scrollBy({ left: 160, behavior: 'smooth' });
                    }
                }
            }, 3000);
        }

        function displayResults(songs) {
            const resultsContainer = document.getElementById('results');
            songs.forEach((song) => {
                const videoId = song.id.videoId;
                const title = song.snippet.title;
                const channelTitle = song.snippet.channelTitle;
                const thumbnailUrl = song.snippet.thumbnails.medium.url;
                const ytUrl = `https://www.youtube.com/watch?v=${videoId}`;
                const uniqueId = Math.random().toString(36).substring(2, 9);
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px; flex:1; cursor:pointer; overflow:hidden;" onclick="playSong('${videoId}')">
                        <img src="${thumbnailUrl}" alt="${title}">
                        <div class="song-info">
                            <div class="song-title">${title}</div>
                            <div class="song-artist">${channelTitle}</div>
                        </div>
                    </div>
                    <button class="menu-btn" onclick="toggleMenu(event, '${uniqueId}')"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    <div class="dropdown-menu" id="menu-${uniqueId}">
                        <a href="${ytUrl}" target="_blank"><i class="fa-solid fa-download"></i> Download / Watch</a>
                        <a href="#" onclick="shareSong('${ytUrl}', '${title}')"><i class="fa-solid fa-share"></i> Share</a>
                    </div>
                `;
                resultsContainer.appendChild(item);
            });
        }

        function toggleMenu(event, uniqueId) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
            const menu = document.getElementById(`menu-${uniqueId}`);
            if (menu) { menu.style.display = menu.style.display === 'block' ? 'none' : 'block'; }
        }

        window.onclick = () => { document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none'); }

        function shareSong(url, title) {
            if (navigator.share) { navigator.share({ title: title, url: url }).catch(console.error); } 
            else { prompt("यह रहा सांग लिंक, कॉपी करें:", url); }
        }

        function playSong(videoId) {
            isPlaying = true;
            isFullScreen = false;
            const playerContainer = document.getElementById('player-container');
            playerContainer.classList.remove('mini-player-active', 'fullscreen-active');
            playerContainer.innerHTML = `
                <div id="video-wrapper" style="position:relative;">
                    <button class="custom-fs-btn" onclick="toggleCustomFullScreen()"><i class="fa-solid fa-expand" id="fs-icon"></i></button>
                    <button class="close-mini-btn" onclick="closePlayer()">✕</button>
                    <iframe id="yt-video" src="https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen="true"></iframe>
                </div>
            `;
        }

        function toggleCustomFullScreen() {
            const playerContainer = document.getElementById('player-container');
            const fsIcon = document.getElementById('fs-icon');
            isFullScreen = !isFullScreen;
            if (isFullScreen) {
                playerContainer.classList.add('fullscreen-active');
                playerContainer.classList.remove('mini-player-active');
                fsIcon.className = "fa-solid fa-compress";
            } else {
                playerContainer.classList.remove('fullscreen-active');
                fsIcon.className = "fa-solid fa-expand";
            }
        }

        function minimizePlayer() {
            if (!isPlaying) return;
            const playerContainer = document.getElementById('player-container');
            playerContainer.classList.add('mini-player-active');
            playerContainer.classList.remove('fullscreen-active');
            isFullScreen = false;
        }

        function closePlayer() {
            isPlaying = false;
            isFullScreen = false;
            const playerContainer = document.getElementById('player-container');
            playerContainer.innerHTML = '';
            playerContainer.classList.remove('mini-player-active', 'fullscreen-active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music Clone</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #030303;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: #030303;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
        }
        .logo i {
            color: #ff0000;
            font-size: 24px;
        }
        .chips-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar {
            display: none;
        }
        .chip {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip.active {
            background-color: #ffffff;
            color: #000000;
        }
        .search-bar {
            display: flex;
            margin: 10px 20px;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #212121;
            color: white;
            outline: none;
        }
        .search-bar button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: #ff0000;
            color: white;
            cursor: pointer;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }
        .list-item img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }
        .song-info {
            flex: 1;
            overflow: hidden;
        }
        .song-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-container {
            padding: 0 20px;
            margin-top: 15px;
        }
        iframe {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            border: none;
        }
        .fs-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            display: block;
            width: 100%;
            font-weight: bold;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #212121;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #aaa;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <i class="fa-solid fa-circle-play"></i>
            <span>Music</span>
        </div>
    </div>

    <div class="chips-container">
        <div class="chip active">Podcasts</div>
        <div class="chip">Romance</div>
        <div class="chip">Feel good</div>
        <div class="chip">Relax</div>
        <div class="chip">Energise</div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs or artists..." value="New Sad Songs">
        <button onclick="searchSongs()">Search</button>
    </div>

    <div id="player-container"></div>

    <div class="section-header">
        <div class="section-title">Quick picks</div>
    </div>

    <div class="list-container" id="results"></div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-compass"></i>
            <span>Samples</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-bookmark"></i>
            <span>Library</span>
        </div>
    </div>

    <script>
        // Yahan apni asli API Key dalein (" ") ke andar
        const API_KEY = "AIzaSyBAZCyyRc8pwqiP_FFQRbDWABWkrP_5AXs";

        window.onload = () => {
            searchSongs();
        };

        async function searchSongs() {
            const query = document.getElementById('searchInput').value || 'Trending Hindi Songs';
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query)}&key=${API_KEY}&maxResults=10`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items) {
                    displayResults(data.items);
                } else if (data.error) {
                    alert("Error: " + data.error.message);
                } else {
                    alert("Songs nahi mile.");
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function displayResults(songs) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            songs.forEach(song => {
                const videoId = song.id.videoId;
                const title = song.snippet.title;
                const channelTitle = song.snippet.channelTitle;
                const thumbnailUrl = song.snippet.thumbnails.medium.url;

                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => playSong(videoId);

                item.innerHTML = `
                    <img src="${thumbnailUrl}" alt="${title}">
                    <div class="song-info">
                        <div class="song-title">${title}</div>
                        <div class="song-artist">${channelTitle}</div>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical" style="color: #aaa;"></i>
                `;

                resultsContainer.appendChild(item);
            });
        }

        function playSong(videoId) {
            const playerContainer = document.getElementById('player-container');
            playerContainer.innerHTML = `
                <div id="video-wrapper">
                    <iframe 
                        id="yt-video"
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        allow="autoplay; encrypted-media; fullscreen" 
                        allowfullscreen>
                    </iframe>
                    <button class="fs-btn" onclick="makeFullScreen()">📱 Badi Screen (Full Screen) par dekhein</button>
                </div>
            `;
            playerContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function makeFullScreen() {
            const iframe = document.getElementById('yt-video');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
